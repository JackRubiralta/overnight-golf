<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio &amp; input test bench</title>
    <style>
      :root { color-scheme: dark; --bg: #121a15; --panel: #1b2620; --line: #2c3b32; --text: #e6efe8; --dim: #93a69a; --accent: #9fd27a; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 4px 0 12px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
      .row > .label { width: 90px; color: var(--dim); font-size: 12px; }
      button { background: #26352c; color: var(--text); border: 1px solid #3a4f42; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
      button:hover { border-color: var(--accent); }
      button.big { background: #335a2a; font-weight: 600; }
      input[type=range] { width: 160px; }
      label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
      #pad, #monitor { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; color: var(--dim); }
      #capture-area { width: 100%; height: 160px; background: #0c120e; border: 1px dashed #3a4f42; border-radius: 6px; display: grid; place-items: center; color: var(--dim); user-select: none; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Thornbury Links — audio &amp; input test bench</h1>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/audio/devpage.ts"></script>
  </body>
</html>
